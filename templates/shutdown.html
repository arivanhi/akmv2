{% extends 'base.html' %} 
{% block title %}Shutdown Sistem{% endblock %} 

{% block content %}
<div class="page-header">
    <h1 class="page-title">Daya Sistem</h1>
</div>

<div class="form-container" style="text-align: center; padding: 50px 20px; max-width: 600px; margin: 0 auto;">
    <div style="font-size: 5rem; color: #dc3545; margin-bottom: 20px;">
        <i class="fas fa-power-off"></i>
    </div>

    <h2 style="margin-bottom: 15px; color: #333;">Kontrol Daya Alat</h2>
    <p style="color: #666; font-size: 1.1rem; margin-bottom: 40px;">
        Pastikan seluruh sesi pengukuran pasien telah disimpan sebelum me-restart atau mematikan perangkat Raspberry Pi.
    </p>

    <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
        <a href="{{ url_for('dashboard') }}" class="btn-submit" style="background-color: #6c757d; text-decoration: none; min-width: 140px; display: inline-flex; align-items: center; justify-content: center;">
            Batal
        </a>

        <button id="btnReboot" class="btn-submit" style="background-color: #f39c12; min-width: 150px;">
            <i class="fas fa-sync-alt"></i> Restart Alat
        </button>

        <button id="btnPowerOff" class="btn-submit" style="background-color: #dc3545; min-width: 150px;">
            <i class="fas fa-power-off"></i> Matikan Alat
        </button>
    </div>

    <div id="shutdownStatus" style="margin-top: 30px; font-weight: bold;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    $('#btnReboot').click(function() {
        if(!confirm("Yakin me-restart perangkat sekarang?")) return;
        let btn = $(this);
        btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Restarting...');
        $.post('/api/system/reboot', function(res) {
            if(res.status === 'success') {
                $('#shutdownStatus').html('<span style="color: #d35400; font-size: 1.2rem;">Sistem sedang direstart... Harap tunggu sekitar 30 detik.</span>');
            } else {
                alert("Gagal: " + res.message);
                btn.prop('disabled', false).html('<i class="fas fa-sync-alt"></i> Restart Alat');
            }
        }).fail(function() {
            alert("Perintah restart dikirim.");
        });
    });

    $('#btnPowerOff').click(function() {
        if(!confirm("Yakin matikan sistem sekarang?")) return;
        let btn = $(this);
        btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Memproses...');
        $.post('/api/system/shutdown', function(res) {
            if(res.status === 'success') {
                $('#shutdownStatus').html('<span style="color: #dc3545; font-size: 1.2rem;">Sistem sedang dimatikan...<br>Silakan tunggu hingga layar mati.</span>');
                setTimeout(function() {
                    $('body').html('<div style="height:100vh; display:flex; justify-content:center; align-items:center; background:#000; color:#fff;"><h1>System Off.</h1></div>');
                }, 3000);
            } else {
                alert("Gagal: " + res.message);
                btn.prop('disabled', false).html('<i class="fas fa-power-off"></i> Matikan Alat');
            }
        }).fail(function() {
            alert("Gagal menghubungi server.");
            btn.prop('disabled', false).html('<i class="fas fa-power-off"></i> Matikan Alat');
        });
    });
});
</script>
{% endblock %}
